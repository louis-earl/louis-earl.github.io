<div class="contact">
  <div class="contact__text">
    <h2>Let's draw something up.</h2>
    <p>Open to senior front-end roles in Melbourne.</p>
  </div>
  <div class="contact__actions">
    <div class="email">
      <a class="button inverse" href="mailto:louis.earl.14@gmail.com">
        louis.earl.14&#64;gmail.com
      </a>
      <button
        type="button"
        class="button icon-button outline-inverse"
        [attr.aria-label]="copySuccess() ? 'Email copied' : 'Copy email address'"
        (click)="copyEmail()"
      >
        <span class="material-icons-round" aria-hidden="true">
          {{ copySuccess() ? 'check' : 'content_copy' }}
        </span>
      </button>
    </div>
    <div class="button__group">
      <a
        class="button outline-inverse"
        href="https://www.linkedin.com/in/louis-earl/"
        target="_blank"
        rel="noopener noreferrer"
        >LinkedIn</a
      >
      <a
        class="button outline-inverse"
        href="https://github.com/louis-earl"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
    </div>
  </div>
  <span class="visually-hidden" aria-live="polite">
    {{ copySuccess() ? 'Email address copied to clipboard' : '' }}
  </span>
</div>
