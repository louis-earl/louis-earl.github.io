<button
  type="button"
  class="scene"
  aria-label="Diagram of three stacked layers: design, front end and back end. Press to assemble or explode it"
  [attr.aria-pressed]="exploded()"
  (click)="toggle()"
>
  <span class="stack" [style.transform]="stackTransform()">
    <span class="layer layer--back blueprint blueprint--fine">
      <span class="layer__label">03 Back end<span class="layer__tech"> · .NET APIs</span></span>
      <span class="layer__tables">
        <span></span><span></span><span></span>
      </span>
    </span>
    <span
      class="layer layer--front"
      [style.--z]="middleOffset() + 'px'"
    >
      <span class="layer__label">02 Front end<span class="layer__tech"> · Angular 21</span></span>
      <span class="layer__bar layer__bar--solid"></span>
      <span class="layer__row"><span></span><span></span></span>
      <span class="layer__bar"></span>
    </span>
    <span
      class="layer layer--design"
      [style.--z]="topOffset() + 'px'"
    >
      <span class="layer__label">01 Design<span class="layer__tech"> · Figma</span></span>
      <span class="layer__bar"></span>
      <span class="layer__row"><span></span><span></span></span>
      <span class="layer__bar"></span>
    </span>
  </span>
</button>
